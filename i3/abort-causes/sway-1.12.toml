# Verified abort causes for unreached sway 1.12 i3-suite rows whose committed
# classification is unverified (the "no TAP plan" label). Each file entry is
# one focused rerun of that test file on pinned sway in the pinned oracle
# container (4 GiB, zero swap, one file at a time). It records where the
# rerun stopped and why. Committed results and classifications are unchanged;
# bucket rules read this file to move rows from N-harness to N-x11-all.
#
# Causes:
#   kill  - runner exit 255; the last TAP assertion is first_unreached - 1;
#           the TAP tail has "Could not get reply for: xcb_intern_atom_reply"
#           (the test's X connection is gone); sway's last handled command is
#           `kill`, and wlroots logs xcb errors on the killed windows after it.
#           i3test windows set no WM_DELETE_WINDOW, so wlroots falls back to
#           xcb_kill_client (wlroots/xwayland/xwm.c:2194-2213 at c1d38536).
#   xtest - the file timeout kills the run (runner exit 124); the last TAP
#           assertion is first_unreached - 1; a second rerun that traces
#           i3test::XTEST calls ends inside xtest_sync_with_i3 (blocked_in).
#           That call waits for an I3_SYNC reply from the window manager
#           (i3/testcases/lib/i3test/XTEST.pm:122-178). wlroots does not handle
#           I3_SYNC ("unhandled x11 client message ... (I3_SYNC)",
#           xwayland/xwm.c:1875-1880), and the swaycal shim replaces only
#           i3test::sync_with_i3, so the call blocks until the file timeout.
#   other - neither signature; the rows stay N-harness.
# Excerpts are under i3/abort-causes/sway-1.12/; excerpt_sha256 is the SHA-256
# of the excerpt file. contrib/validate checks this file against the
# committed sway result.

[run]
compositor = "sway"
snapshot = "sway-1.12"
commit = "88869399f421d9180dd8b6ed0b5a1f4a3585d252"
wlroots = "c1d38536c926134698ff2615843e0d4103e84ac4"
oracle = "915e2eab91561c95fe3064c271d4e3a6a31dd55b"
image = "sha256:f05ab730eac44150e4417f72c88b22c7c4455a6e214c1b287b6d4010012e929c"
date = "2026-10-04"
command = "./contrib/i3-suite-run --compositor sway --binary $SWAY_BINARY --parallel 1 --files FILE"

