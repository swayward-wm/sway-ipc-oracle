# Human-reviewed classifications joined to raw measurements by file and assertion.

[families]
sway_product_version = "These assertions assume i3's product-version numbering. Sway GET_VERSION reports sway's own parsed product version, so swayward likewise reports its own numeric product version rather than impersonating i3."
xwayland_satellite_no_dynamic_x11_state = "xwayland-satellite does not forward post-map X11 WM_CLASS or WM_HINTS urgency changes into the xdg_toplevel metadata/state seen by swayward, so assertions requiring those mutations cannot measure swayward behavior."
sway_no_bar = "These assertions inspect swaybar configuration. Swayward deliberately manages no bar and does not retain a bar configuration; empty GET_BAR_CONFIG therefore reports no bar IDs, while requested IDs fail explicitly."
sway_config_include_ipc = "Sway's GET_VERSION reports only the top-level loaded config path, and GET_CONFIG returns only the assembled current config string. It does not expose i3's included_config_file_names or included_configs metadata."
sway_hidden_scratchpad_floating = "Sway deliberately rejects floating changes on a hidden scratchpad container, while i3 accepts the commands exercised by this regression test."
i3_output_selection_semantics = "These assertions also fail under pinned sway: i3 resolves primary/nonprimary output aliases and its fake-output topology differently, while sway resolves workspace assignments and directional moves through output names and wlroots geometry."
i3_workspace_rename_semantics = "This assertion also fails under pinned sway: i3 resolves `workspace 5` to the numbered `5:xxx` workspace before rename, while sway resolves the exact existing name and rename does not reapply output assignments."
xwayland_satellite_no_x11_class = "Swayward receives xwayland-satellite windows as xdg_toplevels whose app_id contains WM_CLASS; it does not receive a separate X11 class field for sway class criteria."
xwayland_satellite_metadata_limit = "Swayward receives X11 windows from xwayland-satellite as xdg_toplevels. The satellite does not forward X11 window type, XID, requested client geometry, size hints, or WM_HINTS urgency, so assertions whose setup or observation requires those properties cannot measure swayward behavior."
i3_parser_internals = "These tests execute i3 build-only parser binaries and assert i3 parser callbacks and diagnostics, not compositor IPC behavior. Sway has no corresponding standalone parser executables."
sway_no_append_layout = "Sway deliberately omits i3 append_layout and its placeholder/swallow layout restoration model; the command is absent from sway runtime handlers."
sway_command_vocabulary = "These assertions require i3-only command spellings: open creates an empty container and 1pixel aliases border pixel. Sway implements neither spelling."
sway_config_text = "Sway parses its own extended config and GET_CONFIG returns the text sway actually read, including joined continuation lines; an i3 config transformed by the adapter cannot equal the original bytes."
i3_fake_outputs = "These tests require i3's test-only fake-outputs option to create named virtual outputs. Sway has no fake-outputs config command and retains its single HEADLESS-1 output, so assertions about the missing fake-* topology do not apply."
i3_append_layout = "i3 exposes append_layout as a runtime command. Sway's runtime command table has no append_layout handler, so i3 layout-restore assertions do not apply."
i3_open_command = "i3 exposes a test-oriented open runtime command that creates an empty container. Sway's runtime command table has no open handler, so assertions about empty containers created this way do not apply."
sway_ipc_root_border_width = "i3 reports -1 as the root node's unset current_border_width. Sway deliberately initializes synthetic IPC nodes, including the root, with current_border_width 0."
sway_ipc_internal_border_width = "i3 reports -1 as sentinel border metadata on internal containers. Sway reports current border thickness and initializes non-view containers to 0."
workspace_layout_stacked_keyword = "i3 accepts workspace_layout stacked. Sway accepts stacking instead and rejects stacked, so assertions made after loading the i3 spelling do not apply."
headless_xtest_boundary = "The headless harness cannot deliver XTEST events from Xwayland to a Wayland compositor, so assertions that depend on those events are not measured."
xwayland_satellite_kill_disconnects_client = "Swayward sends xdg_toplevel.close when its kill command closes an Xwayland surface. xwayland-satellite handles that event by sending X KillClient when WM_DELETE_WINDOW is absent; i3 instead destroys only the selected window for its default kill mode. i3test creates every test window on one connection without WM_PROTOCOLS, so later assertions cannot run after the first kill."
swayward_geometry_finding = "Focused black-box reruns disagree with the pinned sway run on X11 window geometry, border, size-hint, floating-size, or centering assertions. These are swayward compatibility failures."
swayward_mapping_finding = "Focused black-box reruns disagree with the pinned sway run on which X11 windows are mapped, managed, floating, or represented in the IPC tree. These are swayward compatibility failures."
swayward_tree_finding = "Focused black-box reruns disagree with the pinned sway run on workspace, focus, layout, resize, urgency, mark, or move tree state. These are swayward compatibility failures."
swayward_ipc_finding = "Focused black-box reruns disagree with the pinned sway run on IPC fields, events, command errors, or connection behavior. These are swayward compatibility failures."
swayward_command_finding = "Focused black-box reruns disagree with the pinned sway run on command success or effects. These are swayward compatibility failures."
swayward_adapter_finding = "Focused black-box reruns expose a swayward adapter or process-lifecycle mismatch not present in the pinned sway run. These remain explicit failures."

