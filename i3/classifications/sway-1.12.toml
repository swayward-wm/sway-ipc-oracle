note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'Only 'tiling_user' rule triggered' failed at i3/t/271-for_window_tilingfloating.t:81: TAP $got->[1] = 'floating', expected 'tiling_user'. The sway log shows 'mark A' re-ran view_execute_criteria on A (still floating at that moment, so [floating] fired and added 'floating', mark.c:58-64), then 'floating disable' triggered no for_window re-evaluation. Sway only runs for_window commands from view_execute_criteria, called at view map (view.c:943), title/class/role/type changes (desktop/xwayland.c:691-752, xdg_shell.c:356-601) and the mark command (commands/mark.c:63); floating enable/disable does not call it (commands/floating.c has no criteria call), and each criterion runs at most once per view (view.c:575-578). i3 re-evaluates for_window on a floating/tiling change; A ends with marks [A, floating]. The missing tiling_user rule is also a tiling_from rejection (criteria.c:578-622). Stays a finding."

