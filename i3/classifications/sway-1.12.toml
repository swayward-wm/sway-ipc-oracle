note = "r05 rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536; fail set identical to committed result. line 67 'x midpoint is ws center' got 639 expected 640 (got = the first window's midpoint, expected = the scratchpad-shown window's midpoint); y midpoint passes (assertion 8). The first window's 639 follows from the 75 px minimum width (see assertion 1); the shown window's 1 px difference was not isolated further (root_scratchpad_show re-places via floating_fix_coordinates/set_container_transform)."

