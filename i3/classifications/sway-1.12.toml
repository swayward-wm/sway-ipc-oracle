note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'right window position and size matches gaps expectations' after the same reload: $got->{width}=625, $expected->{width}=616; same cause as assertion 19 (existing workspace keeps its inner gap of 10, sway has no reload step that re-applies workspace gaps)."

