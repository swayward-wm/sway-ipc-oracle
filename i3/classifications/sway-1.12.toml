[[classification]]
file = "210-mark-unmark.t"
assertion = 14
outcome = "fail"
reason = "sway_command_semantics_finding"
reason_verified = true
citation = "i3/src/commands.c:943-947; sway/sway/commands.c:306-309; sway/sway/commands/mark.c:46-61; sway/sway/tree/container.c:1582-1600; i3/t/210-mark-unmark.t:153-158"
note = "rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399 (rows reproduce the committed fail set exactly): '[instance=iamnotunique] mark important' on two matching windows; TAP got '1' expected '0' for success. i3 rejects a mark command whose criteria match more than one window (cmd_mark, commands.c:943-947). Sway has no such check: commands.c:306-309 runs cmd_mark once per matched container and each run calls container_find_and_unmark (container.c:1582-1600) before adding the mark, so the mark moves to the last container and the command reports success. Diagnostic rerun: two windows match, exactly one carries 'important', success=1. sway.5.scd:822-828 says a mark is unique per window but does not say multi-match is rejected; no rejecting handler, so stays N-gap."

