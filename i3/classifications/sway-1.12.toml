citation = "i3/src/manage.c:313-316; i3/src/manage.c:678; sway/sway/tree/view.c:628-663; sway/sway/tree/view.c:812-962; sway/sway/sway.5.scd:417-422; i3/t/212-assign-urgency.t:54"
note = "rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399 (rows reproduce the committed fail set exactly): TAP 'not ok 1 - target workspace is urgent' (ok() reports no got/expected); sway log shows the assign applied (workspace targetws created at map time) but the workspace was not urgent. i3 sets urgency_hint when the assigned workspace is not visible (manage.c:313-316, applied at 678). Sway's view_map picks the assigned workspace in select_workspace (view.c:628-663) and never calls view_set_urgent on that path (view_map, view.c:812-962; view_set_urgent is only reached from activation/urgency requests, view.c:489-511, xwayland.c:772). sway.5.scd:417-422 documents assign as 'for_window <criteria> move container to workspace', which does not mention urgency; no rejecting handler or documented choice about urgency, so stays N-gap."

