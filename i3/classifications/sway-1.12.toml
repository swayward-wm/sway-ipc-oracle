[[classification]]
file = "129-focus-after-close.t"
assertion = 3
outcome = "fail"
reason = "sway_command_semantics_finding"
reason_verified = true
citation = "sway/sway/commands.c:113-143,175-177,274-279; i3/src/commands.c:1727-1744; i3/t/129-focus-after-close.t:29-30"
note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'split container focused after focus parent' failed (ok() on $nodes->[1]->{focused}, no got/expected in TAP): with both 'open' commands rejected the workspace holds no containers, so $nodes->[1] is undef. Root cause for every failure in this file: open_empty_con sends 'open', and sway answers success=false parse_error=true error=\"Unknown/invalid command 'open'\" (diagnostic rerun printed that reply), because 'open' is absent from sway's runtime handler table (commands.c:113-143) so find_core_handler returns NULL (commands.c:274-279). The id returned by open_empty_con is therefore undef and the file never builds i3's empty-container layout. This is a deliberate missing command that the i3_open_command family describes; the row is kept in sway_command_semantics_finding only because the swayward snapshot labels these rows xwm_kill_client_fallback and mirrors sway's bucket (TRAP T2). FLAG for orchestrator: moving 129:3,4,6,9 to i3_open_command is source-supported but changes swayward's published buckets, and swayward's kill label looks wrong for them (they fail at 'open', before any kill)."

