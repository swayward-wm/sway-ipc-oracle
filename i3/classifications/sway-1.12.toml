file = "553-popup_during_fullscreen.t"
assertion = 9
outcome = "fail"
reason = "sway_tree_semantics_finding"
reason_verified = true
citation = "i3/t/553-popup_during_fullscreen.t:80-87; sway/sway/tree/view.c:919-926,945; sway/sway/tree/view.c:697-709"
note = "Rerun 2026-10-26, oracle 8b028185, image rc-1fd3c25b, sway pin 88869399: TAP 9 'fullscreen window focused' fails: got 4194305 (the transient popup) expected 4194304 (w1). With popup_during_fullscreen leave_fullscreen, view_map exits fullscreen of the parent (view.c:919-926) before should_focus (view.c:945), so the popup is focused. i3's test calls this 'arguably a bug' (line 86). Sway documents only 'exit fullscreen, render the dialog' (sway.5.scd:853-857); no deliberate focus rule."

[[classification]]
file = "553-popup_during_fullscreen.t"
assertion = 16
outcome = "fail"
reason = "sway_tree_semantics_finding"
reason_verified = true
citation = "i3/t/553-popup_during_fullscreen.t:112-119; sway/sway/tree/view.c:697-709; sway/sway/tree/container.c:1566-1571"
note = "Rerun 2026-10-26, oracle 8b028185, image rc-1fd3c25b, sway pin 88869399: TAP 16 'popup still focused' fails: got 4194304 (w1) expected 4194305 (popup); TAP 14 'popup focused' (unstable-listed, not a row here) fails the same way. should_focus returns false whenever the workspace has a fullscreen view (view.c:707-710), with no exception for transient popups, so under the default smart mode the popup never takes focus even though container_is_transient_for shows it above the fullscreen window. Behavioural difference; no design citation."

[[classification]]
file = "553-popup_during_fullscreen.t"
assertion = 19
outcome = "fail"
reason = "sway_tree_semantics_finding"
reason_verified = true
citation = "i3/t/553-popup_during_fullscreen.t:128-141; sway/sway/commands/popup_during_fullscreen.c:12-21; sway/sway/tree/view.c:697-709"
note = "Rerun 2026-10-26, oracle 8b028185, image rc-1fd3c25b, sway pin 88869399: TAP 19 'popup focused' fails: got 4194304 (w1) expected 4194305 (popup). Config 'popup_during_fullscreen all' is rejected by sway (sway-log-3: \"Expected 'popup_during_fullscreen smart|ignore|leave_fullscreen'\"; popup_during_fullscreen.c:12-21), so sway stays at its default smart. The failure is not due to the rejection alone: smart also leaves the popup unfocused (should_focus, view.c:707-710; assertions 14/16), so the row stays a tree finding; the missing 'all' value is recorded here as a secondary cause."

