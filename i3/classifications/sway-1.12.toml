note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'left window position and size matches gaps expectations' after 'reload' with new 'workspace 2 gaps inner 16' (issue #5257): $got->{width}=625, $expected->{width}=616, i.e. inner gap stayed 10 on the already-existing workspace 2. Sway copies config->gaps_inner and the matching workspace_config into a workspace only in workspace_create (workspace.c:224-242); reload (reload.c:15-52, idle-scheduled at :71) loads a new config and calls arrange_root, and no code path re-applies gaps_inner/workspace gaps to existing workspaces (every gaps_inner write is in workspace.c:225,242, commands/gaps.c and commands/workspace.c). The earlier assertions 1-12 and 17-18 pass, so gaps themselves work; only the reload pick-up differs."

