note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'workspace 6:a focused' (the file's second 'workspace next' check; label is a copy-paste in the test) got '1', expected '6:b'. Sway's workspace_get_number parses '6:a' and '6:b' both as number 6 (strtoll, workspace.c:538-546); workspace_next picks the least workspace with a strictly greater number (workspace.c:663), finds none after 6:a, and wraps to the first numbered one ('1', workspace.c:672-676). i3 has an explicit tie rule 'two workspaces with the same number but different names: take the next one' (i3/src/workspace.c:645-648) that sway lacks."

