[[classification]]
file = "100-fullscreen.t"
assertion = 17
outcome = "fail"
reason = "sway_xwayland_geometry_finding"
reason_verified = true
citation = "sway/sway/tree/arrange.c:264-322; sway/sway/tree/view.c:1195-1199; wlroots/xwayland/xwm.c:1398-1406 (c1d38536); i3/src/x.c:1223-1228; i3/t/100-fullscreen.t:122-134"
note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'Window got repositioned' failed (no got/expected in TAP; the assertion is ok(!eq_hash($new_rect,$original_rect))). A diagnostic rerun of the same file with a diag line before the assertion printed new=0,0,30,30 orig=0,0,30,30, i.e. the second window opened under a fullscreen window was never moved or resized. While workspace->fullscreen is set, arrange_workspace arranges only the fullscreen container and skips the tiling children and floating list (arrange.c:310-322), so the new view is never given a rect and never configured; view_is_visible only reports it hidden in sway's own tree (view.c:1195-1199). i3 unmaps the frame of a container hidden by fullscreen (x.c:1223-1228), whereas sway keeps the X window mapped. Same cause as the already-reviewed assertion 16 (X window stays mapped: xwm.c:1398-1406 maps on MapRequest unconditionally; the rerun printed mapped=1). This is a behavioural consequence, not a documented choice, so it stays a finding."

[[classification]]
file = "319-gaps.t"
assertion = 13
outcome = "fail"
reason = "sway_tree_semantics_finding"
reason_verified = true
citation = "sway/sway/tree/view.c:408-420; sway/sway/tree/arrange.c:199-210; sway/sway/commands/hide_edge_borders.c:15-18; sway/sway/sway.5.scd:791-796; i3/src/render.c:437-454; i3/t/319-gaps.t:168-198"
note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'left window position and size matches gaps expectations' (stacked container inside splith, issue #5261): $got->{y}=37, $expected->{y}=10. After the helper is destroyed the stacked container holds one window with border pixel 0. i3 adds the stack decoration only if p->children > 1 or the border is not pixel/none (render.c:450-453), so the lone window stays at y=10. Sway keeps the title bar of a lone stacked/tabbed child unless config->hide_lone_tab is set (view.c:408-420 offsets by titlebar_height*siblings->length, 27 px here), and that flag is set only by the opt-in 'hide_edge_borders --i3' (hide_edge_borders.c:15-18, documented in sway.5.scd:791-796), which the i3 test config does not use. Documented sway behaviour with an opt-in i3 mode, but no source states the default as a rejection of i3's semantics, and the test config does not request the opt-in; stays a finding."

