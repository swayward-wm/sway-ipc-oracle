note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'mark set for 'floating' criterion' failed at i3/t/271-for_window_tilingfloating.t:48: TAP got undef, expected an ARRAY (marks). The test reads $nodes[0]->{nodes}[0]->{marks} on the floating_nodes entry, i3's floating_con wrapper around the client. Sway lists the view container itself in floating_nodes (workspace->floating holds the views, ipc-json.c:534-540; workspace_add_floating, workspace.c:961-967) with type floating_con set on that node (ipc-json.c:714-717), and its nodes[] is empty for a view (883-893), so the lookup is undef. The sway log shows the for_window mark was applied to the floating view, so the TAP does not show whether the rule worked, only that the i3 wrapper shape is absent."

