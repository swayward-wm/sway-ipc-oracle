note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'focus on fake-1' got 'fake-2', expected 'fake-1' (three outputs 1080x1920+0+0, 1920x200+1080+1720, 1080x1920+1280+0; 'focus output right' from fake-0). Sway's focus_output uses wlr_output_layout_adjacent_output NEAREST: among outputs entirely to the right it takes the smallest squared distance from the current output's centre (540,960) to the candidate's closest point (wlr_output_layout.c:425-482): fake-2 is 547600, fake-1 (1080,1720) is 869200, so fake-2 wins. i3's get_output_next picks the overlapping output with the smallest x (randr.c:259-318), which is fake-1. Different selection rule, neither source states it as a rejection of i3's; stays a finding."

