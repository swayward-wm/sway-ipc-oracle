[[classification]]
file = "274-move-branch-position.t"
assertion = 3
outcome = "fail"
reason = "sway_tree_semantics_finding"
reason_verified = true
citation = "i3/t/274-move-branch-position.t:150; sway/sway/commands/move.c:112-139,153-165"
note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'moving con right into a stack placed it below the focused-inactive leaf' failed at i3/t/274-move-branch-position.t:150: TAP got '3', expected '5' (target position vs focused-inactive leaf position + 1; the leaf sits at 4). Moving right into a stack into a branch whose layout is perpendicular to the move descends to the focused-inactive child (move.c:153-165) and then, because that child is a view not a sibling, inserts at container_sibling_index(destination) + offset where offset is 1 only for LEFT/UP (move.c:124-138). For right the offset is 0, so the moved container lands before the focused-inactive child (position 3, leaf pushed to 4); i3 places it after. The left/up cases (assertions 11-16) pass. The offset is explicit in code but no comment or doc states it as a deliberate departure from i3, so it stays a finding."

