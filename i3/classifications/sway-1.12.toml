note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'Marks updated after 'floating_user' criterion' failed at i3/t/271-for_window_tilingfloating.t:62: TAP $got->[0] = 'floating', expected 'floating_auto'. Sway only runs for_window commands from view_execute_criteria, called at view map (view.c:943), title/class/role/type changes (desktop/xwayland.c:691-752, xdg_shell.c:356-601) and the mark command (commands/mark.c:63); floating enable/disable does not call it (commands/floating.c has no criteria call), and each criterion runs at most once per view (view.c:575-578). i3 re-evaluates for_window on a floating/tiling change; here the tiling container B (floating disable) keeps its old 'floating' mark instead of gaining 'tiling'/'tiling_user'; the tiling_from/floating_from rules are additionally rejected (criteria.c:578-622, see the sway_criteria_vocabulary rows 2 and 18). Behaviour difference in command effect; no sway source states it as a deliberate choice, so it stays a finding."

