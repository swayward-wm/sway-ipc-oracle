note = "2026-10-26 rerun at oracle 8b028185, image rc-1fd3c25b: 'target workspace is urgent' failed (ok() with false). A probe in the same container showed the source workspace is not urgent even before the move: the test's _NET_WM_STATE_DEMANDS_ATTENTION client message reaches wlroots, which emits request_demands_attention, but sway registers no listener (no 'demands' in sway/ or include/) and its only X11 urgency path is WM_HINTS (handle_set_hints), so S is never urgent. The move code itself updates urgency (workspace_detect_urgent on old and new workspace). Assertion 12 passes vacuously."

