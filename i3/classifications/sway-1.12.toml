citation = "i3/t/241-consistent-center.t:36-38; sway/sway/tree/container.c:779-795,833-848,850-893; sway/sway/config.c:268-269"
note = "r05 rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536; fail set identical to committed result. sway enforces the 75x50 default floating minimum (config.c:268-269, container.c:779-795,833-848) and centres the content box (container.c:850-893), so the 30x30 X window is configured 75 wide at x=602 (assertions 9/10, third window x=602 confirm); line 37 'x coordinates match' got 639 expected 640 (int(602+75/2) vs int(1280/2)); y passes (assertion 2)."

