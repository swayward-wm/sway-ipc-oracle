note = "Rerun 2026-10-26 at oracle 8b028185, sway 88869399, image rc-1fd3c25b (fail set identical to the committed result): 'workspace 6 now focused' (line 142) got '6', expected '6: baz'. The test uses the i3-only 'open' (lines 122, 127) to keep workspaces 5 and 6 alive; sway has no such handler (Unknown/invalid command), so workspace 6 is empty and is destroyed when focus leaves it (workspace_consider_destroy; log 'Destroying workspace 6'). 'rename workspace 6 to 6: baz' then fails with 'There is no workspace with that name' (rename.c:61-64) and 'workspace number 6' recreates a workspace named '6'. Rerun workspace names after the rename: '5: foo' only."

