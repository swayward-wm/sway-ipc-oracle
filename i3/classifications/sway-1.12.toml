note = "2026-10-26 rerun at oracle 8b028185, image rc-1fd3c25b (exit 0, fail_assertions reproduce the committed [2,3,4] / [20,22,24,30,32,38]); got 1, expected 0 on right-top. '[class=first] move down' leaves the first window on right-top: sway-log shows a single 'move down' that arranges right-top only, with no output change, while the second window's earlier 'move down, move down' did cross to right-bottom. Source: a window that has a parent (the stacked/wrapper container) crosses outputs only via the singleton branch (move.c:388-392, requires !wrapped, parent without parent, parent with exactly one child); otherwise the promote branch (move.c:393-411) keeps it on the same workspace. i3 moves it to right-bottom."

