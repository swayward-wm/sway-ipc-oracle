note = "r05 rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536; fail set identical to committed result. subtest 'kill doesn't produce focus event' (line 76) ran no assertions ('1..0'; 'No tests run for subtest', TAP #8) and the file aborts after 8 with 'Could not get reply for: xcb_intern_atom_reply' (exit 255; 9 and 10 unreached). sway log: one 'kill' command emits 3 window::close events and xcb BadWindow errors on all three windows 4194304-4194306. The test windows set no WM_DELETE_WINDOW (i3test open_window), so wlr_xwayland_surface_close falls to xcb_kill_client (xwm.c:2211) and the whole X connection of the test dies; i3 destroys only the selected window (x.c:328-338). The test's windows set no WM_PROTOCOLS (i3/testcases/lib/i3test.pm.in:332-362, as cited by swayward's xwm_kill_client_fallback family). Kept in N-gap: behaviour plus source establish the mechanism but not a design exception; swayward's paired 219:8 row is swayward_ipc_finding, so no mirror effect (T2 n/a)."

