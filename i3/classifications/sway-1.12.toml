note = "2026-10-26 rerun at oracle 8b028185, image rc-1fd3c25b, sway 88869399 (141-resize.t: 84 assertions, same 17 fails as committed): after 'split h' on the right window, 'resize grow width 10px or 25 ppt' prefers the ppt amount and converts it against the nearest L_HORIZ ancestor, the new 640 px wrapper (resize.c:252-257) = 160 px; container_find_resize_parent then skips the one-child wrapper layers and resizes the 1280 px workspace level (resize.c:52-63), so 160/1280 = 0.125 is applied, not 0.25. TAP at line 298: |got-expected| 0.125 (cmp_float needs < 1e-6)."

