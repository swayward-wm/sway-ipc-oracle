note = "Rerun 2026-10-26 at oracle 8b028185, sway 88869399, image rc-1fd3c25b (fail set identical to the committed result): 'one container on 2' (t/166-assign.t line 44) got 0, expected 1. The test sends the i3-only command 'open' to create an empty container; sway has no 'open' handler and answers Unknown/invalid command (commands.c:113-143, 274-277), so workspace 2 stays empty. Kept in N-gap because swayward's kill-label row 166-assign.t:13 mirrors this bucket (T2); the cause fits family i3_open_command if the orchestrator approves a move."

