note = "2026-10-26 rerun at oracle 8b028185, image rc-1fd3c25b, sway 88869399 (141-resize.t: 84 assertions, same 17 fails as committed): the test's get_floating_rect finds a floating node by the 'window' ids of floating_node->{nodes}. Sway lists the view container itself in floating_nodes (workspace_add_floating, no i3-style floating wrapper), its 'window' is on that node and its nodes[] is empty, so the lookup returns undef. TAP line 447: 'Use of uninitialized value in addition', got undef, expected '10'. Assertion 83 passes only because undef == undef; the TAP does not show whether the criteria resize itself worked."

