note = "Rerun 2026-10-26 at oracle 8b028185, image rc-1fd3c25b, sway 88869399/wlroots c1d38536 (fail set matches the committed result): 'workspace 1 and 5 on fake-0' got [] ($got->[0] does not exist), expected ['1','5']. The test's own helper workspaces_per_screen finds each output's i3 'content' child with first { $_->{type} eq 'con' } and reads workspaces from it. Sway's GET_TREE has no such node: an output's children are its workspaces directly (ipc-json.c:860-875), so the helper gets undef and an empty list. The adapter's optional shim replaces only i3test.pm helpers (Shim.pm:339-362), which is why assertions 3-6 (get_ws_content) pass, not the copy of this lookup inside the .t file. Cause is the missing content node, which is a real tree-shape difference; no family covers it yet (candidate for a content-node family, orchestrator decision), so it stays a finding like the same lookup in 504-move-workspace-to-output.t."

