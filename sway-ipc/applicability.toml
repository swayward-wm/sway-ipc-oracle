i3_source = "i3/parser-specs/commands.spec:43-58, pinned at 9be3249ac5b377ed3270e36bca83df53d8023337"
sway_extension_source = "sway/sway/criteria.c:578-620, pinned at 88869399f421d9180dd8b6ed0b5a1f4a3585d252"

