# Human-reviewed triage of miracle-wm-0.11.2-command-fuzz sway IPC command-fuzz mismatches, keyed by case.
# design difference: miracle-wm documents or deliberately builds the behaviour; deviation: an
# undocumented difference from sway, with the miracle-wm source that produces it. Every source
# cites miracle-wm at 2df22b0e (the pin) unless it names sway. contrib/validate prints the untriaged count.
#
# Crash rows are compositor-health verdicts, not mismatches, and are not listed:
# - gaps-overflow ('gaps inner current set 2147483648'): std::stoi throws std::out_of_range, which
#   parse_int does not catch (src/ipc_command_executor.cpp:85-99); the process exits with status 1.
# - family-exit-criteria-value ('[app_id=] exit') and family-exit-criteria-name ('[oracle_field=value] exit'):
#   exit ignores criteria (src/ipc_command_executor.cpp:179-182 calls quit() and replies success), so the
#   compositor exits with status 0 after replying success where sway answers an error.


[[classification]]
case = "whitespace"
triage = "deviation"
finding = "miracle-command-parser-lenient"
reason = "\" \\t \": miracle: [{\"error\": \"Unsupported command type: \\t\", \"parse_error\": true, \"success\": false}]; sway: []. miracle's command parser is lenient where sway's rejects or splits: a tab before any command starts a command named '\\t'."
source = "miracle-wm 2df22b0e src/ipc_command.cpp:47-48 (only ' ' and ';' delimit commands; ',' is not a separator), 163-210 (root state: a ';' or '\\t' before any command starts a command of that text), 211-275 (criteria keys and values never fail; an unknown key becomes ContainerScopeType::none via scope_from_string 57-90, which src/leaf_container.cpp:1032-1033 never matches), 277-283 (a quoted literal has no escape handling), 396-400 (text still inside an unterminated literal or criteria block at the end is dropped); src/ipc_command.h:99 and src/ipc_command.cpp:158-161 (the parser copies the payload as a C string, so anything after a NUL is ignored); a criteria command that matches nothing still answers success (src/ipc_command_executor.cpp:316-318)"

