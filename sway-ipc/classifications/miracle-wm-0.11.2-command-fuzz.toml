[[classification]]
case = "family-layout-quote"
triage = "deviation"
finding = "miracle-command-parser-lenient"
reason = "\"layout \\\"unterminated\": miracle: [{\"error\": \"No arguments were supplied\", \"parse_error\": true, \"success\": false}]; sway: [{\"error\": \"Expected 'layout default|tabbed|stacking|splitv|splith' or 'layout toggle [split|all]' or 'layout toggle [split|tabbed|stacking|splitv|splith] [split|tabbed|stacking|splitv|splith]...'\", \"parse_error\": true, \"success\": false}]. miracle's command parser is lenient where sway's rejects or splits: the argument inside the unterminated quote is dropped, so the command runs with no argument. Both reject the command, with different text."
source = "miracle-wm 2df22b0e src/ipc_command.cpp:47-48 (only ' ' and ';' delimit commands; ',' is not a separator), 163-210 (root state: a ';' or '\\t' before any command starts a command of that text), 211-275 (criteria keys and values never fail; an unknown key becomes ContainerScopeType::none via scope_from_string 57-90, which src/leaf_container.cpp:1032-1033 never matches), 277-283 (a quoted literal has no escape handling), 396-400 (text still inside an unterminated literal or criteria block at the end is dropped); src/ipc_command.h:99 and src/ipc_command.cpp:158-161 (the parser copies the payload as a C string, so anything after a NUL is ignored); a criteria command that matches nothing still answers success (src/ipc_command_executor.cpp:316-318)"

