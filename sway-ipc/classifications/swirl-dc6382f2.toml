triage = "design difference"
finding = "scroll-removed-split-layout"
reason = "The scenario runs split, splith, splitv or layout, which scroll removed: each answers \"Unknown/invalid command\" (success false where sway succeeds). The scenario's later commands then act on scroll's column layout instead of the nested or tabbed/stacked tree sway built; 'focus parent' does not select a parent, so 'floating enable' floats the view rather than a split group. The remaining differences are the column layout, layout names and extra container keys of the scroll-column-layout rows."
source = "swirl dc6382f2 inherits scroll commit 7e5f5391 'commands: remove unsupported commands' (deletes sway/commands/layout.c and split.c); sway/commands.c:45-209 (no split, splith, splitv, splitt or layout handler); sway/commands/focus.c:400-423 (focus parent and focus child only change the insertion mode); swirl dc6382f2 README.md:20 (windows are columns on an infinite strip), 98-100 (scroll's layout features remain; based on scroll 1.12.17); TUTORIAL.md:14-32 (each workspace is a row of columns; in the default horizontal mode each new window gets a column of its own); include/sway/tree/container.h:13-17 (layouts L_NONE, L_HORIZ, L_VERT only); sway/tree/layout.c:823-850 (layout_wrap_into_container), 864-866 (each new tiled view is wrapped in a column of the opposite orientation); sway/config.c:246 (layout_default_width 0.5); sway/ipc-json.c:54-75 (layout and orientation named horizontal/vertical/none), 579-580, 594-595, 698, 734-735 (fully_visible, surface_content_rect, trailmark, width_fraction, height_fraction added to container replies; sway/scroll-ipc.7.scd:417) (the same code as scroll f80c5820, inherited through scroll 1.12.17)"

