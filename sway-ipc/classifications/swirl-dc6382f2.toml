triage = "design difference"
finding = "scroll-output-scale-adjust"
reason = "scroll adjusts a fractional output scale given without 'force' to the nearest value at which the logical output size is a whole number. 'output HEADLESS-1 scale 1.25' on the 1270x1408 output becomes 1.0 (sway 1.25), and 'scale 1.5' on 1280x720 at transform 270 becomes 1.6 (sway 1.5). The smart scale_filter then reports 'nearest' for scale 1.0 where sway reports 'linear' for 1.25, and the output percent follows the different logical size."
source = "swirl dc6382f2 sway/config/output.c:538-560 (verify_good_scale), 605-620 (a scale that is not given with force is moved to the nearest k/120 giving an integer logical size), 744-751 (scale_filter smart: nearest for an integer scale); sway/scroll-output.5.scd:79-91 ('scroll will warn you and try to adjust your scale factor'), 93-99 (the same code as scroll f80c5820, inherited through scroll 1.12.17)"

