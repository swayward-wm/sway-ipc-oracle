reason = "The workspace 'init' event reports the new workspace with layout and orientation 'none': scroll sends the event before layout_init assigns the workspace layout. sway assigns the layout first, so its init event reports 'splitv' or 'splith'. scroll's documentation does not describe this ordering. The scenario also runs splith, which scroll removed, so no floating split group exists and the event count differs from sway (scroll-removed-split-layout)."
