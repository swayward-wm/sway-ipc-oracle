[[classification]]
rows = [
    "two_outputs.events",
    "disabled_output_evacuation.events",
]
triage = "deviation"
finding = "scroll-workspace-move-event-order"
reason = "'move workspace to output right' emits the window 'focus' event before the workspace 'move' event; sway emits 'move' then 'focus'. scroll's port of sway commit 7ba11d6d moved the focus call into workspace_move_to_output ahead of the event, which sway's version of that commit does not do. The row also has the scroll-workspace-init-event-layout and scroll-column-layout differences."
source = "swirl dc6382f2 sway/tree/workspace.c:1612-1644 (workspace_move_to_output calls seat_set_focus at 1640-1641 before the workspace 'move' event at 1643; added in inherited scroll commit 0132b0c1 'sway chase: Make workspace_move_to_output reusable (7ba11d6d)'); pinned sway 88869399 sway/tree/workspace.c:1131-1161 sends the 'move' event inside workspace_move_to_output and sway/commands/move.c:659-667 sets focus afterwards; swirl dc6382f2 sway/tree/workspace.c:280-283 (workspace_create sends the 'init' event before layout_init sets the workspace layout), sway/tree/layout.c:82-96, 648-659 (layout_init/layout_modifiers_init set layout.type), sway/ipc-json.c:529-534; pinned sway 88869399 sets ws->layout before the init event (sway/tree/workspace.c:219, 268) (the same code as scroll f80c5820, inherited through scroll 1.12.17)"
