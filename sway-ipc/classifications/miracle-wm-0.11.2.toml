# Human-reviewed triage of miracle-wm-0.11.2 sway IPC state mismatches, keyed by scenario.request.
# design difference: miracle-wm documents or deliberately builds the behaviour; deviation: an
# undocumented difference from sway, with the miracle-wm source that produces it. Every source
# cites miracle-wm at 2df22b0e (the pin) unless it names sway. contrib/validate prints the untriaged count.
#
# Crashes are compositor-health rows, not mismatches, and are not listed. The committed state result has
# none; see sway-ipc/adapters/miracle-wm.md 'Crashes' for the full-corpus SIGSEGV at 'move container to mark'
# (likely cause, not traced: src/command_controller.cpp:1827-1872 moves the marked window's own parent and
# then looks up the marked window's parent at 1863-1865).


