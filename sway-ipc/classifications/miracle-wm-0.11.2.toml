triage = "deviation"
finding = "miracle-command-success-unchecked"
reason = "miracle's command handlers reply success without checking the controller's result. Where sway reports an error because the command cannot apply (an empty workspace, a tiled container for move position, no room to resize), miracle replies success. Here 'move position 100 px 100 px' succeeds. miracle-wm implements a subset of sway's command language. Commands outside it (here: 'splith', 'floating enable') answer \"Unsupported command type: <command>\" or, for floating and fullscreen, \"Expected 'toggle'\", with success false where sway succeeds, and change nothing."
