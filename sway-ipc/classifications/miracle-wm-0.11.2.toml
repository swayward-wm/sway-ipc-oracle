[[classification]]
rows = ["command_coverage.commands"]
triage = "deviation"
finding = "miracle-command-success-unchecked"
reason = "miracle's command handlers reply success without checking the controller's result. Where sway reports an error because the command cannot apply (an empty workspace, a tiled container for move position, no room to resize), miracle replies success. Here 'resize grow width 10 px' succeeds (on the second of two tiled windows; sway answers \"Cannot resize any further\"). miracle-wm implements a subset of sway's command language. Commands outside it (here: 'allow_tearing enable', 'inhibit_idle focus', 'max_render_time 1', 'opacity 0.9', 'shortcuts_inhibitor enable', 'title_format command-title', '[app_id=\"^fixture-command-2$\"] kill') answer \"Unsupported command type: <command>\" or, for floating and fullscreen, \"Expected 'toggle'\", with success false where sway succeeds, and change nothing."
source = "miracle-wm 2df22b0e src/ipc_command_executor.cpp: process_resize 1157-1209 (try_resize/try_set_size results are dropped and success is returned at 1177, 1192, 1206), the move position branch 472-507, move scratchpad 646-650, process_sticky 751-767, process_scratchpad 1075-1086, process_layout 975-978 (layout default), process_mark 1221-1236 (CommandController::mark returns void, src/command_controller.cpp:1895-1908), criteria focus 316-318; the CommandController methods return false when nothing matches (e.g. src/command_controller.cpp:371-375, 529-537, 1415-1422, 1593-1601); miracle-wm 2df22b0e src/ipc_command_executor.cpp:157-228 (RUN_COMMAND handlers exist only for exec, split, focus, move, swap, sticky, exit, input, workspace, layout, fullscreen, floating, scratchpad, resize, reload, mark, unmark, rename, gaps, nop and debug; every other command answers \"Unsupported command type: <command>\" at 225-226), src/ipc_command.cpp:92-155 (command_from_string), 1047-1073 of src/ipc_command_executor.cpp (fullscreen and floating accept only 'toggle'); wiki/docs/ipc/index.md:72-86 (the documented command set: exec, split, layout, focus, move, mark, resize, swap, sticky, workspace, rename, gaps, scratchpad, nop); sway-ipc/adapters/miracle-wm.md 'Translations' (no output or kill command)"

