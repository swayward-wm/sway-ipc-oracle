triage = "design difference"
finding = "miracle-ipc-reply-shape"
reason = "GET_OUTPUTS entries are miracle's documented shape (name, make, model, serial, active, dpms, power, primary, scale, subpixel_hinting, current_workspace, rect, modes, current_mode), without sway's type, transform, container keys, features, hdr, max_render_time and so on, so every entry reports 'keys differ'. subpixel_hinting is derived from the pixel format and is never 'unknown' (sway reports 'unknown' for the headless output). Having no type key, the entries are not touched by the oracle's backend-output-name rule (which applies to type 'output'), so miracle's Virtual-N is compared with sway's normalized name; the row would differ on its key set regardless."
source = "miracle-wm 2df22b0e src/output.cpp:525-600 (get_outputs_json; subpixel_hinting from the pixel format at 558-573); wiki/docs/ipc/get_outputs.md:10-43 (documented keys and values rgb|bgr|vrgb|vbgr|none); sway-ipc/normalize.toml backend-output-name"

