source = "miracle-wm 2df22b0e src/ipc_command_executor.cpp:157-228 (RUN_COMMAND handlers exist only for exec, split, focus, move, swap, sticky, exit, input, workspace, layout, fullscreen, floating, scratchpad, resize, reload, mark, unmark, rename, gaps, nop and debug; every other command answers \"Unsupported command type: <command>\" at 225-226), src/ipc_command.cpp:92-155 (command_from_string), 1047-1073 of src/ipc_command_executor.cpp (fullscreen and floating accept only 'toggle'); wiki/docs/ipc/index.md:72-86 (the documented command set: exec, split, layout, focus, move, mark, resize, swap, sticky, workspace, rename, gaps, scratchpad, nop); sway-ipc/adapters/miracle-wm.md 'Translations' (no output or kill command); miracle-wm 2df22b0e src/command_controller.cpp:2269-2315 (root is {id, name, rect, nodes, type} over the real outputs only), src/output.cpp:422-524 (output node, orientation 'none', scale_filter 'linear'), src/workspace.cpp:833-908 (workspace node, policy, orientation 'none'), src/leaf_container.cpp:1052-1124 (window node); wiki/docs/ipc/get_tree.md:16-231 (documented schema: type root|output|workspace|con|floating_con, policy, scale_filter 'Supplied but unused and always linear', orientation 'Deprecated so always none')"

