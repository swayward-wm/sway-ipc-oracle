reason = "Every seed first diverges at step 1, the GET_TREE after the first 'exec foot'. The replay stops at the first differing step, so the random corpus measures nothing after it. GET_TREE is miracle's own node schema (documented in get_tree.md), not sway's. The root carries only id, name, rect, nodes and type, and there is no __i3 pseudo-output or __i3_scratch workspace, so sway's tree has one more output node and every pairing below the root is shifted: sway's __i3 is compared with miracle's first output and __i3_scratch with miracle's first workspace (with two outputs, sway's first real output is compared with miracle's second). That is why names, nums, focus, child counts, layouts, scale, transform, mode and scale_filter differ at those paths; the windows under sway's real outputs are not reached. Output and workspace nodes report orientation 'none', output nodes always report scale_filter 'linear', and the node key sets differ from sway's (no marks, floating, representation, percent on workspaces; policy added)."
source = "miracle-wm 2df22b0e src/command_controller.cpp:2269-2315 (root is {id, name, rect, nodes, type} over the real outputs only), src/output.cpp:422-524 (output node, orientation 'none', scale_filter 'linear'), src/workspace.cpp:833-908 (workspace node, policy, orientation 'none'), src/leaf_container.cpp:1052-1124 (window node); wiki/docs/ipc/get_tree.md:16-231 (documented schema: type root|output|workspace|con|floating_con, policy, scale_filter 'Supplied but unused and always linear', orientation 'Deprecated so always none')"
