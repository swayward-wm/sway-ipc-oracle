[[classification]]
case = "family-default_border-quote"
triage = "design difference"
finding = "scroll-border-csd"
reason = "scroll accepts 'csd' as a border style, so the usage text of default_border and default_floating_border (and their deprecated aliases new_window and new_float) lists <none|normal|pixel|csd>."
source = "swirl dc6382f2 sway/commands/default_border.c:18-22, sway/commands/default_floating_border.c:19-24, sway/commands/new_window.c:5-13, sway/commands/new_float.c:5-13; sway/scroll.5.scd:1462, 1487 (default_border and default_floating_border accept csd) (the same code as scroll f80c5820, inherited through scroll 1.12.17)"

