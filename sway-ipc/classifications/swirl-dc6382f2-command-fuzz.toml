# Human-reviewed triage of swirl-dc6382f2 sway IPC command-fuzz mismatches, keyed by case.
# swirl is a rebrand of scroll 1.12.17. Every row here measured the same as the scroll-1.12.21 row
# and has the same cause in the same code, so it reuses the scroll classification (finding, triage,
# reason) with its sources re-cited at swirl dc6382f2 (the pin). design difference: the compositor
# documents or deliberately builds the behaviour; deviation: an undocumented difference from sway.
# contrib/validate prints the untriaged count.

[[classification]]
case = "family-layout-invalid"
triage = "design difference"
finding = "scroll-removed-split-layout"
reason = "split, splith, splitv, splitt and layout were removed from scroll, so every malformed form answers \"Unknown/invalid command '<name>'\" instead of sway's argument error (and 'splitt' with no argument fails where sway succeeds)."
source = "swirl dc6382f2 inherits scroll commit 7e5f5391 'commands: remove unsupported commands' (deletes sway/commands/layout.c and split.c); sway/commands.c:45-209 (no split, splith, splitv, splitt or layout handler); sway/commands/focus.c:400-423 (focus parent and focus child only change the insertion mode) (the same code as scroll f80c5820, inherited through scroll 1.12.17)"

