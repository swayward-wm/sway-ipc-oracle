[[classification]]
case = "family-kill-invalid"
triage = "design difference"
finding = "scroll-kill-arguments"
reason = "scroll's kill takes focused|unfocused|all and rejects any other argument (\"Unknown command: kill oracle_invalid\"); sway's kill ignores its arguments and succeeds."
source = "swirl dc6382f2 sway/commands/kill.c:28-57; sway/scroll.5.scd:1606-1611 ('kill <focused>|unfocused|all'); sway 88869399 sway/commands/kill.c:15-30 (the same code as scroll f80c5820, inherited through scroll 1.12.17)"

[[classification]]
case = "family-floating-quote"
triage = "design difference"
finding = "scroll-floating-empty-workspace"
reason = "On an empty workspace scroll answers \"'floating' needs a container\" where sway answers \"Can't float an empty workspace\": scroll removed workspace_wrap_children and takes the workspace's focused tiling container instead."
source = "swirl dc6382f2 sway/commands/floating.c:23-31; inherited scroll commit 3b2ed15b 'Remove workspace_wrap_children() and modify commands to use the inactive tiling focused container'; sway 88869399 sway/commands/floating.c:25-27 (the same code as scroll f80c5820, inherited through scroll 1.12.17)"

