# Human-reviewed triage of miracle-wm-0.11.2-events sway IPC events mismatches, keyed by scenario.request.
# design difference: miracle-wm documents or deliberately builds the behaviour; deviation: an
# undocumented difference from sway, with the miracle-wm source that produces it. Every source
# cites miracle-wm at 2df22b0e (the pin) unless it names sway. contrib/validate prints the untriaged count.
# Reasons that describe miracle's event sequence use a live re-run of the events corpus in the pinned
# image (sway-ipc-oracle:miracle-o2, same runner actions); the committed result's differences matched it
# for 43 of 44 rows (command_coverage differed by one difference line).


[[classification]]
rows = [
    "one_window.events",
    "differential_seed_0.events",
]
triage = "deviation"
finding = "miracle-window-event-visibility"
reason = "Window events report the container with focused false, and tiled windows also with visible false: miracle serialises window events as if the workspace were not visible (a TODO in the source), so even the 'focus' event of the focused window says focused false, where sway reports focused true and visible true. The window events carry miracle's documented container JSON (border 'normal' at the configured width, name = the application name, empty for foot, rather than the title, shell 'miracle-wm', idle_inhibitors user 'visible', window = the container id, percent already computed, type floating_con for floating windows): design difference. miracle has no window 'title' change, so sway's 'title' event after each 'new' is absent and the following events pair with the wrong sway events: design difference. Some actions send two consecutive 'focus' events for the same window, for example on map (observed in a live re-run in the pinned image)."
source = "miracle-wm 2df22b0e src/ipc_connection_manager.cpp:437-447 (send_window_event serialises container.to_json(false), commented 'TODO: Handle workspace visibility'), src/leaf_container.cpp:1058-1060, 1080, 1113 (tiled window: visible is false when the workspace is not visible; focused = visible && is_focused()), src/freestyle_window_container.cpp:524, 541, 573 (floating window: the flag is ignored, visible true); miracle-wm 2df22b0e src/leaf_container.cpp:1052-1124 (window node: border 'normal' at the configured width, name = application name, shell 'miracle-wm', idle_inhibitors user 'visible', window = container id), src/freestyle_window_container.cpp:569 (floating windows are type floating_con); wiki/docs/ipc/events/window.md:12-22 (window changes are new, close, focus, fullscreen_mode, move, mark, urgent: no title), 24-82, wiki/docs/ipc/get_tree.md:196-213; src/ipc_connection_manager.cpp:518-551 (no title event is sent)"

