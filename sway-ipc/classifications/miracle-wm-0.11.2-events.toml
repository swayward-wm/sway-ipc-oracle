[[classification]]
rows = ["grouped_scratchpad_hidden.events"]
triage = "design difference"
finding = "miracle-command-subset"
reason = "Earlier in the scenario 'splith', 'floating enable' were unsupported, so there is no floating split container: 'focus parent' selected the workspace root and the command under test ('move scratchpad') acted on a single tiled window instead. miracle-wm implements a subset of sway's command language. Commands outside it (here: 'splith', 'floating enable') answer \"Unsupported command type: <command>\" or, for floating and fullscreen, \"Expected 'toggle'\", with success false where sway succeeds, and change nothing. The window events carry miracle's documented container JSON (border 'normal' at the configured width, name = the application name, empty for foot, rather than the title, shell 'miracle-wm', idle_inhibitors user 'visible', window = the container id, percent already computed, type floating_con for floating windows): design difference."
