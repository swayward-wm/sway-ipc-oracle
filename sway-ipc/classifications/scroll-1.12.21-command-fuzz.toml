[[classification]]
case = "family-default_border-quote"
triage = "design difference"
finding = "scroll-border-csd"
reason = "scroll accepts 'csd' as a border style, so the usage text of default_border and default_floating_border (and their deprecated aliases new_window and new_float) lists <none|normal|pixel|csd>."
source = "scroll f80c5820 sway/commands/default_border.c:17-21, sway/commands/default_floating_border.c:18-23, sway/commands/new_window.c:5-13, sway/commands/new_float.c:5-13; README.md:2187 ('default_border csd', 'default_floating_border csd')"

