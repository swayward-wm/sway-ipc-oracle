# Human-reviewed triage of scroll-1.12.21 sway IPC command-fuzz mismatches, keyed by case.
# design difference: scroll documents or deliberately builds the behaviour; deviation: an
# undocumented difference from sway, with the scroll source that produces it. Every source
# cites scroll at f80c5820 (the pin) unless it names sway. contrib/validate prints the untriaged count.

[[classification]]
case = "family-layout-invalid"
triage = "design difference"
finding = "scroll-removed-split-layout"
reason = "split, splith, splitv, splitt and layout were removed from scroll, so every malformed form answers \"Unknown/invalid command '<name>'\" instead of sway's argument error (and 'splitt' with no argument fails where sway succeeds)."
source = "scroll f80c5820 commit 7e5f5391 'commands: remove unsupported commands' (deletes sway/commands/layout.c and split.c); sway/commands.c:45-209 (no split, splith, splitv, splitt or layout handler); README.md:2117 ('removes all the original sway/i3 layouts'); sway/commands/focus.c:400-423 (focus parent and focus child only change the insertion mode)"

