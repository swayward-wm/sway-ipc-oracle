# Scenario recipes are compositor-neutral sway/i3 commands. `window:ID` opens a
# standalone client; `foreign_toplevel:ID|REQUEST` sends one wlr foreign-toplevel
# request to it; `capture:NAME` records tree, workspaces, and outputs.
# Add scenarios by appending a table. The runner resets state before each table.

[[scenario]]
name = "empty"
actions = ["capture:empty"]

[[scenario]]
name = "one_window"
actions = ["window:fixture-1", "capture:one_window"]

[[scenario]]
name = "two_split_h"
actions = ["command:splith", "window:fixture-1", "window:fixture-2", "capture:two_split_h"]

[[scenario]]
name = "two_split_v"
actions = ["command:splitv", "window:fixture-1", "window:fixture-2", "capture:two_split_v"]

[[scenario]]
name = "nested_h_in_v"
actions = ["window:fixture-1", "command:splitv", "window:fixture-2", "command:splith", "window:fixture-3", "capture:nested_h_in_v"]

[[scenario]]
name = "tabbed"
