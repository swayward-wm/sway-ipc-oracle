[[scenario]]
name = "default_floating_fixed_width"
corpora = ["state"]
requires = ["xdg-toplevel-size-hints"]
not_applicable = true
reason = "i3 does not implement xdg-shell; the equivalent X11 WM_NORMAL_HINTS exercise a different protocol path."
actions = ["hint_window:fixture-fixed-width|300|100|300|200|0", "window:fixture-border-settle", "command:[app_id=\"^fixture-border-settle$\"] kill", "command:[app_id=\"^fixture-fixed-width$\"] border normal 2", "capture:default_floating_fixed_width"]

