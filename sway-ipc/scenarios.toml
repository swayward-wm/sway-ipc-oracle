requires = ["sway-command-language"]
not_applicable = true
reason = "i3 has no urgent command; source: i3/src/commands.c command table. This covers compositor-originated urgency via IPC; client-originated urgency is not covered."
actions = ["window:fixture-1", "command:workspace 2", "command:[app_id=\"^fixture-1$\"] urgent enable", "capture:urgent_via_command"]

